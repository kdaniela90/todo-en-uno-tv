name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --no-obfuscate --android-skip-build-dependency-validation

      - name: Generate version.json
        run: |
          VERSION_CODE=$(grep '^version:' pubspec.yaml | grep -oP '\+\K[0-9]+')
          VERSION_NAME=$(grep '^version:' pubspec.yaml | grep -oP '[0-9]+\.[0-9]+\.[0-9]+')
          cat > version.json << EOF
          {
            "versionCode": $VERSION_CODE,
            "versionName": "$VERSION_NAME",
            "downloadUrl": "https://github.com/kdaniela90/todo-en-uno-tv/releases/download/latest/app-release.apk",
            "releaseNotes": "Nueva versión disponible. Actualiza para obtener las últimas mejoras."
          }
          EOF

      - name: Commit version.json
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add version.json
          git diff --staged --quiet || git commit -m "chore: update version.json [skip ci]"
          git push

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          files: build/app/outputs/flutter-apk/app-release.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
