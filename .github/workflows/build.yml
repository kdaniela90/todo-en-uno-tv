name: Build Android APK

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'version.json'   # Evita loop cuando el bot hace push de version.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.9'

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --no-obfuscate --android-skip-build-dependency-validation

      # 1️⃣ Sube el APK PRIMERO — el archivo tiene que estar disponible
      #    antes de que version.json anuncie la nueva versión
      - name: Create / Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          files: build/app/outputs/flutter-apk/app-release.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 2️⃣ Solo DESPUÉS de que el APK esté subido, actualiza version.json
      - name: Generate version.json
        run: |
          VERSION_CODE=$(grep '^version:' pubspec.yaml | grep -oP '\+\K[0-9]+')
          VERSION_NAME=$(grep '^version:' pubspec.yaml | grep -oP '[0-9]+\.[0-9]+\.[0-9]+')
          printf '{\n  "versionCode": %s,\n  "versionName": "%s",\n  "downloadUrl": "https://github.com/kdaniela90/todo-en-uno-tv/releases/download/latest/app-release.apk",\n  "releaseNotes": "Nueva versión disponible. Actualiza para obtener las últimas mejoras."\n}\n' \
            "$VERSION_CODE" "$VERSION_NAME" > version.json
          echo "▶ version.json generado: v$VERSION_NAME ($VERSION_CODE)"
          cat version.json

      - name: Commit version.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json
          git diff --cached --quiet && echo "Sin cambios en version.json" && exit 0
          git commit -m "chore: sync version.json [skip ci]"
          git push
